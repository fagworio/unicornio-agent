[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unicornio-editor"
version = "0.1.0"
description = "Agente editorial seguro para posts WordPress pending"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10,<13",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
unicornio-editor = "unicornio_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
