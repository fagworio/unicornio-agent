services:
  database:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    environment:
      MYSQL_DATABASE: ${WP_E2E_DB_NAME:?generated by the E2E runner}
      MYSQL_USER: ${WP_E2E_DB_USER:?generated by the E2E runner}
      MYSQL_PASSWORD: ${WP_E2E_DB_PASSWORD:?generated by the E2E runner}
      MYSQL_ROOT_PASSWORD: ${WP_E2E_DB_ROOT_PASSWORD:?generated by the E2E runner}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 3s
      timeout: 3s
      retries: 30

  wordpress:
    image: wordpress:7.1.3-php8.3-apache@sha256:d42f63cb89ad0eab272c4b393164e63830d0df270009907919f7dcce52b1a20b
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WP_E2E_DB_NAME:?generated by the E2E runner}
      WORDPRESS_DB_USER: ${WP_E2E_DB_USER:?generated by the E2E runner}
      WORDPRESS_DB_PASSWORD: ${WP_E2E_DB_PASSWORD:?generated by the E2E runner}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'DISABLE_WP_CRON', true );
    ports:
      - "127.0.0.1:${WP_E2E_PORT:?selected by the E2E runner}:80"
    volumes:
      - wordpress_data:/var/www/html
    healthcheck:
      test:
        - CMD-SHELL
        - "php -r '$$socket = @fsockopen(\"127.0.0.1\", 80); exit($$socket ? 0 : 1);'"
      interval: 3s
      timeout: 3s
      retries: 30

  wpcli:
    image: wordpress:cli-2.12.0-php8.3@sha256:661db880e953da051abcac6c0a769767b995a82cd52101c003ca7438dd427d7d
    profiles: [tools]
    depends_on:
      database:
        condition: service_healthy
    user: "33:33"
    working_dir: /var/www/html
    environment:
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WP_E2E_DB_NAME:?generated by the E2E runner}
      WORDPRESS_DB_USER: ${WP_E2E_DB_USER:?generated by the E2E runner}
      WORDPRESS_DB_PASSWORD: ${WP_E2E_DB_PASSWORD:?generated by the E2E runner}
    volumes:
      - wordpress_data:/var/www/html
    command: ["sleep", "infinity"]

volumes:
  wordpress_data:
